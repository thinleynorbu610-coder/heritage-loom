services:
  mongodb:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    expose:
      - "6379"

  api:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongodb:27017/heritage_loom?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run dev"
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
